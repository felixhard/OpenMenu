name: Feature request
description: Suggest an improvement to OpenMenu.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the task or problem you run into today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could OpenMenu help?
      description: Describe the behavior you want and mention any workaround you use today.
